name: CI

# Runs on pull requests and on demand only (not on every push), to keep Actions usage low.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm perf:bundle
      - name: Enforce first-load JS budget (brotli ≤ 130 KB)
        run: node -e "const r=require('./docs/perf/bundle.json');const kb=r.initialJS.brotli/1024;console.log('initial JS (brotli)',kb.toFixed(1),'KB');if(kb>130)process.exit(1)"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
